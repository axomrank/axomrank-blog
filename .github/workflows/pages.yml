name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_resubmit:
        description: Resubmit the entire sitemap to IndexNow
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://axomrank.github.io/axomrank-blog' }}
  INDEXNOW_KEY: 2c859e69b0d1b787235cb93079a45d48

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v4
      # PYQ dataset for /question-papers/ and /questions/ (only the data and figures, not the PDFs)
      - uses: actions/checkout@v4
        with:
          repository: axomrank/assam-exam-pyq
          path: pyq-data
          sparse-checkout: |
            questions.csv
            catalog.json
            exams/*/*/figures
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y fonts-dejavu-core fonts-noto-core
      - run: pip install -r requirements.txt
      - run: python build.py --pyq-dir pyq-data --base-url "$BASE_URL"
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - run: python scripts/check_site.py "$BASE_URL"
      - id: indexnow
        name: Prepare IndexNow changes
        env:
          RESUBMIT: ${{ inputs.indexnow_resubmit }}
        run: |
          args=()
          if [ "$RESUBMIT" = true ]; then args+=(--resubmit); fi
          payload=$(python scripts/indexnow.py "$BASE_URL" "$INDEXNOW_KEY" "${args[@]}")
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow of changed pages
        if: needs.build.outputs.indexnow_payload != ''
        continue-on-error: true
        env:
          INDEXNOW_PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
        run: |
          for attempt in 1 2 3 4 5; do
            if test "$(curl -fsS --max-time 20 "${BASE_URL%/}/$INDEXNOW_KEY.txt?run=$GITHUB_RUN_ID")" = "$INDEXNOW_KEY"; then
              status=$(curl -fsS --retry 2 --max-time 30 -o /dev/null -w '%{http_code}' --json "$INDEXNOW_PAYLOAD" https://api.indexnow.org/indexnow)
              echo "IndexNow response: $status"
              case "$status" in 200|202) exit 0 ;; *) exit 1 ;; esac
            fi
            sleep 8
          done
          echo 'IndexNow key is not yet reachable at the deployed site' >&2
          exit 1
